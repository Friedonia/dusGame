<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leaderboard & Akte</title>
    <style>
        body { background: #000; color: #fff; font-family: monospace; padding: 20px; text-align: center; }
        .box { background: #111; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #222; }
        .row:last-child { border: none; }
        
        .badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .badge { background: #222; border: 1px solid #444; border-radius: 8px; padding: 15px; filter: grayscale(100%); opacity: 0.5; transition: 0.3s; }
        .badge.unlocked { filter: grayscale(0%); opacity: 1; border-color: #ffcc00; box-shadow: 0 0 10px rgba(255,204,0,0.4); }
        .badge-icon { font-size: 30px; margin-bottom: 5px; }
        .badge-title { font-weight: bold; font-size: 14px; color: #fff; }
        .badge-desc { font-size: 11px; color: #aaa; }
        
        .btn { display: block; width: 100%; padding: 15px; background: #3366ff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; text-decoration: none; margin-top: 20px; }
    </style>
</head>
<body>

    <h2 style="color:#00ffcc; text-transform:uppercase;">🏆 Globales Leaderboard</h2>
    <div class="box" id="leaderboard-container">Lade Daten...</div>

    <h2 style="color:#00ffcc; text-transform:uppercase; margin-top:30px;">🕵️ Deine Agenten-Akte</h2>
    <div class="box" style="display:flex; justify-content:space-around;">
        <div>
            <div id="stat-hacks" style="font-size:30px; color:#00ffcc; font-weight:bold;">0</div>
            <div style="font-size:12px; color:#aaa;">ZONEN GEHACKT</div>
        </div>
        <div>
            <div id="stat-km" style="font-size:30px; color:#ff8800; font-weight:bold;">0.0</div>
            <div style="font-size:12px; color:#aaa;">KM GELAUFEN</div>
        </div>
    </div>

    <h3 style="color:#aaa; text-align:left; margin-bottom:5px;">Abzeichen & Erfolge:</h3>
    <div class="badge-grid">
        <div class="badge" id="badge-scout">
            <div class="badge-icon">🚶</div>
            <div class="badge-title">Scout</div>
            <div class="badge-desc">2 km gelaufen</div>
        </div>
        <div class="badge" id="badge-marathon">
            <div class="badge-icon">🏃</div>
            <div class="badge-title">Marathon</div>
            <div class="badge-desc">10 km gelaufen</div>
        </div>
        <div class="badge" id="badge-hacker">
            <div class="badge-icon">💻</div>
            <div class="badge-title">Hacker</div>
            <div class="badge-desc">10 Zonen gehackt</div>
        </div>
        <div class="badge" id="badge-sprengmeister">
            <div class="badge-icon">💣</div>
            <div class="badge-title">Sprengmeister</div>
            <div class="badge-desc">5 Fallen ausgelöst</div>
        </div>
    </div>

    <a href="#" onclick="history.back()" class="btn">◀ ZURÜCK ZUM RADAR</a>

    <script>
        const team = localStorage.getItem('team') || 'rot';
        const player = localStorage.getItem('playerNum') || '1';
        const teamColors = { rot: '#ff3333', blau: '#3366ff', gruen: '#33ff33', gelb: '#ffcc00' };
        const teamNames = { rot: 'ROT', blau: 'BLAU', gruen: 'GRÜN', gelb: 'GELB' };

        fetch(`/api/stats?team=${team}&player=${player}`)
        .then(res => res.json())
        .then(data => {
            // 1. Leaderboard sortieren
            let teams = ['rot', 'blau', 'gruen', 'gelb'];
            teams.sort((a, b) => {
                if (data.leaderboard[b].zones !== data.leaderboard[a].zones) return data.leaderboard[b].zones - data.leaderboard[a].zones;
                return data.leaderboard[b].coins - data.leaderboard[a].coins;
            });

            let lbHtml = "";
            teams.forEach((t, index) => {
                let isMe = t === team;
                let border = `border-left: 5px solid ${teamColors[t]};`;
                let bg = isMe ? "background:#222;" : "";
                
                lbHtml += `
                    <div class="row" style="${border} ${bg}">
                        <div style="text-align:left;">
                            <strong style="color:${teamColors[t]}; font-size:16px;">${index+1}. Team ${teamNames[t]}</strong><br>
                            <span style="font-size:12px; color:#aaa;">Cooldown: ${data.teamCooldowns[t] || 0} Min</span>
                        </div>
                        <div style="text-align:right;">
                            <strong>${data.leaderboard[t].zones} 🎯</strong><br>
                            <span style="color:#ffcc00; font-size:13px;">${data.leaderboard[t].coins} 💰</span>
                        </div>
                    </div>
                `;
            });
            document.getElementById('leaderboard-container').innerHTML = lbHtml;

            // 2. Persönliche Stats
            let distance = parseFloat(data.personal.distance);
            let hacks = data.personal.hacks;
            let traps = data.personal.trapsHit;

            document.getElementById('stat-hacks').innerText = hacks;
            document.getElementById('stat-km').innerText = distance.toFixed(2);

            // 3. Abzeichen freischalten!
            if (distance >= 2.0) document.getElementById('badge-scout').classList.add('unlocked');
            if (distance >= 10.0) document.getElementById('badge-marathon').classList.add('unlocked');
            if (hacks >= 10) document.getElementById('badge-hacker').classList.add('unlocked');
            if (traps >= 5) document.getElementById('badge-sprengmeister').classList.add('unlocked');
        });
    </script>
</body>
</html>
