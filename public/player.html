<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spieler HUD</title>
    <link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log("SW Error", err));
    }
</script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --team-color: #ff3333; /* Wird per JS überschrieben */
        }
        
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #111; color: white; overflow: hidden; }
        
        /* Karten-Hintergrund leicht einfärben */
        body.tint-rot #map::before { content: ""; position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(255, 51, 51, 0.08); z-index: 400; pointer-events: none; }
        body.tint-blau #map::before { content: ""; position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(51, 102, 255, 0.08); z-index: 400; pointer-events: none; }
        body.tint-gruen #map::before { content: ""; position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(51, 255, 51, 0.08); z-index: 400; pointer-events: none; }
        body.tint-gelb #map::before { content: ""; position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(255, 204, 0, 0.08); z-index: 400; pointer-events: none; }

        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* HUD OBEN (Scanner & Cooldown) */
        #hud-container {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
            background: rgba(15, 15, 15, 0.95); border: 2px solid var(--team-color);
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; overflow: hidden;
            backdrop-filter: blur(5px);
        }

        #hud-header {
            background: var(--team-color); color: #000; padding: 10px; font-weight: 900;
            text-align: center; text-transform: uppercase; letter-spacing: 1px; font-size: 14px;
        }

        #hud-content-wrapper { transition: max-height 0.3s ease-out; max-height: 500px; overflow: hidden; }
        #hud-content-wrapper.collapsed { max-height: 0; }

        .hud-content { padding: 12px; }

        .btn-send {
            background: #333; color: white; border: 1px solid #555; padding: 12px;
            width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer;
            margin-top: 8px; text-transform: uppercase; font-size: 14px;
        }

        /* Manuelle Eingabe kompakt */
        .manual-box {
            display: flex; gap: 8px; margin-top: 10px;
        }
        .manual-box input {
            flex: 1; padding: 10px; background: #222; border: 1px solid #444;
            color: white; border-radius: 6px; font-family: monospace; text-align: center; font-size: 16px;
        }
        .manual-box button {
            background: #444; color: white; border: none; padding: 10px 15px;
            border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        #toggle-hud-btn {
            background: #111; color: var(--team-color); text-align: center; padding: 8px;
            font-size: 11px; cursor: pointer; font-weight: bold; border-top: 1px solid #333; text-transform: uppercase;
        }

        /* CHAT WIDGET UNTEN */
        #chat-widget {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(20, 20, 20, 0.95); border-top: 2px solid var(--team-color);
            border-radius: 15px 15px 0 0; display: none; flex-direction: column;
            transition: transform 0.3s ease; transform: translateY(calc(100% - 45px));
        }
        #chat-widget.open { transform: translateY(0); }

        .chat-header {
            background: var(--team-color); color: #000; padding: 12px; font-weight: bold;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            border-radius: 12px 12px 0 0; font-size: 14px; text-transform: uppercase;
        }

        #chat-badge {
            background: red; color: white; border-radius: 50%; padding: 2px 6px;
            font-size: 11px; font-weight: bold; display: none;
        }

        #chat-messages { height: 200px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; }
        
        .chat-input-area { display: flex; padding: 10px; background: #111; border-top: 1px solid #333; gap: 8px; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 20px; border: none; background: #333; color: white; outline: none; }
        .chat-input-area button { background: var(--team-color); color: #000; border: none; padding: 10px 15px; border-radius: 20px; font-weight: bold; }

        /* Globale Anzeigen */
        #announcement-banner {
            position: absolute; top: 70px; left: 10px; right: 10px; background: rgba(255, 0, 0, 0.9);
            color: white; padding: 10px; text-align: center; font-weight: bold; border-radius: 5px;
            z-index: 2000; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        #game-timer {
            position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.8);
            color: #fff; padding: 5px 10px; border-radius: 5px; font-family: monospace;
            font-size: 18px; font-weight: bold; z-index: 1001; border: 1px solid #444; display: none;
        }

        #coin-display {
            position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.8);
            color: #ffcc00; padding: 5px 10px; border-radius: 5px; font-weight: bold;
            z-index: 1001; border: 1px solid #444; display: none;
        }

        /* Debug Menu auf Mobile verstecken */
        @media (max-width: 600px) {
            #debug-player-switch { display: none !important; }
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="announcement-banner">⚠️ ADMIN NACHRICHT</div>
    <div id="game-timer">00:00</div>
    <div id="coin-display">💰 <span id="team-coins-val">0</span></div>

    <div id="hud-container">
        <div id="hud-header">Initialisiere Scanner...</div>
        
        <div id="team-selector-container" style="padding: 15px;">
            <h3 style="margin-top:0; text-align:center; font-size:16px;">Wähle dein Team:</h3>
            <button class="btn-send" style="background:#ff3333; color:white; border:none;" onclick="setTeam('rot')">Team Rot</button>
            <button class="btn-send" style="background:#3366ff; color:white; border:none;" onclick="setTeam('blau')">Team Blau</button>
            <button class="btn-send" style="background:#33ff33; color:black; border:none;" onclick="setTeam('gruen')">Team Grün</button>
            <button class="btn-send" style="background:#ffcc00; color:black; border:none;" onclick="setTeam('gelb')">Team Gelb</button>
        </div>

        <div id="hud-content-wrapper">
            <div id="player-controls" class="hud-content" style="display: none;">
                
                <div id="status" style="margin-bottom: 10px;">Lade GPS...</div>

                <div id="manual-scan" style="margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;">
                    <div style="font-size: 11px; color: #888; text-align: center;">NFC defekt oder iPhone? Code manuell eingeben:</div>
                    <div class="manual-box">
                        <input type="text" id="manual-code-input" placeholder="z.B. TR#1234#56">
                        <button onclick="submitManualCode()">Senden</button>
                    </div>
                </div>
                <button onclick="openShopModal()" style="background:#444; color:#fff; border:1px solid #666; padding:10px; border-radius:5px; margin-top:10px; width:100%;">🎒 SHOP & RUCKSACK</button>
            </div>
        </div>

        <div id="toggle-hud-btn" style="display: none;" onclick="toggleHud()">▲ Einklappen ▲</div>
    </div>

    <div id="chat-widget">
        <div class="chat-header" onclick="toggleChat()">
            <div>💬 Funkgerät (HQ)</div>
            <div id="chat-badge">Neu</div>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-message-input" placeholder="Nachricht an Team..." onkeypress="if(event.key === 'Enter') sendChat()">
            <button onclick="sendChat()">➤</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="player.js"></script>
</body>
</html>
