<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spieler Radar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="player.css" />
</head>
<body>

    <div id="game-timer">00:00</div>
    <div id="announcement-banner" onclick="this.style.display='none'">⚠️ ACHTUNG: Nachricht!</div>

    <div id="hud-wrapper">
        <div id="hud-header">🛡️ HQ Verbindung...</div>
        <div id="hud-content-wrapper">
            <div id="hud-content">

                <div id="team-selector-container">
                    <h3 style="margin-top:0; color:#aaa; font-size: 14px;">1. Wähle dein Team:</h3>
                    <div style="display: flex; gap: 8px; margin-bottom: 5px;">
                        <button class="btn-send" style="background:#ff3333; color:white; flex:1;" onclick="selectTeam('rot')">Rot</button>
                        <button class="btn-send" style="background:#3366ff; color:white; flex:1;" onclick="selectTeam('blau')">Blau</button>
                    </div>
                    <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                        <button class="btn-send" style="background:#33ff33; color:black; flex:1;" onclick="selectTeam('gruen')">Grün</button>
                        <button class="btn-send" style="background:#ffcc00; color:black; flex:1;" onclick="selectTeam('gelb')">Gelb</button>
                    </div>
                </div>

<div id="debug-player-switch" style="position: fixed; bottom: 80px; left: 20px; background: rgba(0, 0, 0, 0.8); color: white; padding: 10px; border-radius: 8px; z-index: 9999; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 8px;">
  <div style="font-size: 14px; font-weight: bold; color: #aaa;">🛠 Troubleshooting:</div>
  <button onclick="changePlayer(1)" style="padding: 6px 10px; cursor: pointer; border-radius: 4px; border: none; font-weight: bold; background: #eee; color: #000;">Spieler 1</button>
  <button onclick="changePlayer(2)" style="padding: 6px 10px; cursor: pointer; border-radius: 4px; border: none; font-weight: bold; background: #eee; color: #000;">Spieler 2</button>
  <button onclick="changePlayer(3)" style="padding: 6px 10px; cursor: pointer; border-radius: 4px; border: none; font-weight: bold; background: #eee; color: #000;">Spieler 3</button>
</div>

                <div id="player-controls" style="display: none;">
                    <div id="coin-display">💰 Kasse: <span id="team-coins-val">0</span> Coins</div>
                    <button id="start-gps-btn" class="btn-send" style="width: 100%; margin-bottom: 10px; background: var(--team-color); color: #000;" onclick="startGPS()">📍 GPS Verbinden</button>
                    <div id="cooldown-status">⏳ Lade Scanner...</div>
                    <div id="manual-scan">
                        <p style="margin-bottom: 8px;">NFC defekt? Code hier tippen:</p>
                        <div class="input-group">
                            <input type="text" id="manual-code-input" placeholder="TR#1234#56" autocomplete="off">
                            <button class="btn-send" onclick="submitManualCode()">Senden</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <button id="toggle-hud-btn" onclick="toggleHud()" style="display:none;">▲ Einklappen ▲</button>
    </div>

    <div id="chat-widget" style="display:none;">
        <div id="chat-header" onclick="toggleChat()">💬 Funkgerät (Admin) <span id="chat-badge">0</span></div>
        <div id="chat-messages"><div class="msg admin">System: Verschlüsselte Verbindung steht.</div></div>
        <div id="chat-input-area">
            <input type="text" id="chat-message-input" placeholder="Nachricht...">
            <button id="chat-send-btn" onclick="sendChat()">➤</button>
        </div>
    </div>

    <div id="map"></div>
<div id="debug-player-switch" style="position: fixed; bottom: 20px; left: 20px; background: rgba(0, 0, 0, 0.8); color: white; padding: 10px; border-radius: 8px; z-index: 9999; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
  <div style="font-size: 12px; margin-bottom: 8px; color: #aaa;">🛠 Troubleshooting</div>
  <button onclick="changePlayer(1)" style="margin-right: 5px; padding: 5px 10px; cursor: pointer;">Spieler 1</button>
  <button onclick="changePlayer(2)" style="margin-right: 5px; padding: 5px 10px; cursor: pointer;">Spieler 2</button>
  <button onclick="changePlayer(3)" style="padding: 5px 10px; cursor: pointer;">Spieler 3</button>
</div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="player.js"></script>
</body>
</html>
