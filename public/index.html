<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DusGame - Login</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111; color: white;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .login-box {
            background: #222;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 80%;
            max-width: 350px;
        }
        h1 { margin-top: 0; color: #ff8800; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #444;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ff8800;
            color: black;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #e67a00; }
        
        .footer {
            margin-top: 30px;
            font-size: 13px;
        }
        .footer a {
            color: #aaa;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s;
        }
        .footer a:hover { color: white; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>DusGame Login</h1>
        <p>Bitte gib deinen Zugangscode ein:</p>
        <input type="text" id="codeInput" placeholder="Code eingeben..." autocomplete="off">
        <button onclick="checkCode()">Spiel beitreten</button>
    </div>

    <div class="footer">
        <a href="datenschutz.html">Datenschutz</a>
        <a href="impressum.html">Impressum</a>
    </div>

    <script>
        function checkCode() {
            // Wandelt die Eingabe in Kleinbuchstaben um und entfernt Leerzeichen
            const code = document.getElementById('codeInput').value.trim().toLowerCase();
            
            // 1. Admin Login
            if (code === 'admin') {  // Den Code für das Admin-Panel kannst du hier ändern (z.B. 'geheim123')
                window.location.href = 'admin.html';
                return;
            }
            
            // 2. Spieler Codes (z.B. rot1, blau2, gruen3)
            // Hier legst du fest, welcher Code auf welche URL weiterleitet
            const playerCodes = {
                'rot1': { team: 'rot', player: 1 },
                'rot2': { team: 'rot', player: 2 },
                'rot3': { team: 'rot', player: 3 },
                'blau1': { team: 'blau', player: 1 },
                'blau2': { team: 'blau', player: 2 },
                'blau3': { team: 'blau', player: 3 },
                'gruen1': { team: 'gruen', player: 1 },
                'gruen2': { team: 'gruen', player: 2 },
                'gruen3': { team: 'gruen', player: 3 },
                'gelb1': { team: 'gelb', player: 1 },
                'gelb2': { team: 'gelb', player: 2 },
                'gelb3': { team: 'gelb', player: 3 }
            };

            // Wenn der Code in der Liste steht, zum HUD weiterleiten
            if (playerCodes[code]) {
                const data = playerCodes[code];
                window.location.href = `player.html?team=${data.team}&player=${data.player}`;
                return;
            }

            // Wenn kein Code passt:
            alert('Ungültiger Code! Bitte überprüfe deine Eingabe.');
        }

        // Erlaubt es, den Code auch direkt mit der "Enter"-Taste abzusenden
        document.getElementById('codeInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkCode();
            }
        });
    </script>

</body>
</html>
