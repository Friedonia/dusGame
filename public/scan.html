<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zonen Terminal</title>
    <style>
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0a0a0a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        
        #terminal { background: rgba(20, 20, 25, 0.85); backdrop-filter: blur(10px); border-radius: 12px; padding: 25px; width: 100%; max-width: 400px; border: 2px solid #444; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; transition: border-color 0.3s;}
        
        h2 { margin-top: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        
        .btn { width: 100%; padding: 15px; margin-bottom: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: transform 0.1s, filter 0.2s; }
        .btn:active { transform: scale(0.96); }
        .btn:hover { filter: brightness(1.2); }
        
        .btn-back { background: #333; color: white; margin-top: 20px; border: 1px solid #555; }
        
        #message { margin: 20px 0; font-size: 15px; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="terminal">
        <h2>📡 Terminal</h2>
        <div id="message">Verbindung wird aufgebaut...</div>
        <button id="btn-return" class="btn btn-back" style="display:none;" onclick="returnToHQ()">Zurück zum Radar</button>
    </div>

    <script src="scan.js"></script>
</body>
</html>
